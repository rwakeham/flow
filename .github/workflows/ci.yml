# Tests, on every pull request and every push to main. Also called by the
# maintainer's release workflow before a release is published.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version backend/Dockerfile builds on, so what is tested is what deploys.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: deploy.sh and setup.sh behaviour (deploys nothing)
        run: python3 tests/test_deploy_script.py

      - name: Release tooling
        if: hashFiles('.github/release/test_release.py') != ''
        run: python -m pytest -q .github/release
