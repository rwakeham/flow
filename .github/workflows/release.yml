# Every push to main releases: the run works out the next version from the commits since
# the last release, privacy-checks the tree and the notes, commits the bump to
# backend/VERSION, tags it v<version> with the notes and publishes the GitHub Release. A push
# that changed only tests or CI waits for the next user-facing change. A manual run
# (Actions -> Release -> Run workflow, on main) does the same with a bump you pick, or a dry
# run, and releases a docs-only change as a patch. See .github/release/README.md.
#
# Pull requests run the same steps up to the preview: what the next release would be, its
# notes and the privacy check (the denylist required, except for a fork or Dependabot, which
# have no repository secrets). They never commit, tag or publish.
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto: from the commits since the last release)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Dry run: show what would be released, change nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name != 'pull_request'     # ci.yml already runs on pull requests
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    if: ${{ !cancelled() && github.repository == 'rwakeham/flow' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write                           # the version bump commit, the tag and the Release
    env:
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                        # every tag and the history the bump and notes come from

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 .github/release/release.py next --bump "$BUMP" --ok-if-nothing \
            > "$RUNNER_TEMP/next" 2> "$RUNNER_TEMP/why"
          cat "$RUNNER_TEMP/next" >> "$GITHUB_OUTPUT"
          # Only tests or CI changed and nobody asked for a release: the first line
          # would show a bump that will not happen, so say so instead.
          if [[ "$EVENT" != "workflow_dispatch" ]] && grep -qx 'trivial=true' "$RUNNER_TEMP/next"; then
            sed -i '1s/^\(Flow [0-9.]*\) -> [0-9.]* (patch)$/\1: no release yet (would be a patch)/' "$RUNNER_TEMP/why"
          fi
          cat "$RUNNER_TEMP/why"
          { echo '```'; cat "$RUNNER_TEMP/why"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          NOTHING: ${{ steps.next.outputs.nothing }}
          TRIVIAL: ${{ steps.next.outputs.trivial }}
          TAG: ${{ steps.next.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish=false
          if [[ "$NOTHING" == "true" ]]; then
            why="nothing to release since the last release"
          elif [[ "$EVENT" != "workflow_dispatch" && "$TRIVIAL" == "true" ]]; then
            why="preview of ${TAG}: only tests or CI changed since the last release; released with the next user-facing change, or by a manual run"
          elif [[ "$EVENT" == "pull_request" ]]; then
            why="preview of ${TAG}: merging releases it"
          elif [[ "$REF" != "refs/heads/main" ]]; then
            why="releases run on main only"
          elif [[ "$DRY_RUN" == "true" ]]; then
            why="dry run of ${TAG} (as asked)"
          else
            publish=true
            why="releasing ${TAG}"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "### ${why}" >> "$GITHUB_STEP_SUMMARY"
          echo "$why"

      - name: Bump backend/VERSION (a local commit until the release is published)
        if: steps.next.outputs.nothing != 'true' && steps.next.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > backend/VERSION
          git -c "user.name=$BOT_NAME" -c "user.email=$BOT_EMAIL" commit --quiet -m "Release ${VERSION}" backend/VERSION

      - name: Build the release notes and the tree to check
        if: steps.next.outputs.nothing != 'true'
        run: |
          python3 .github/release/release.py snapshot "$RUNNER_TEMP/preview/tree"
          python3 .github/release/release.py notes "$RUNNER_TEMP/preview/notes.md"

      - name: Privacy check
        if: steps.next.outputs.nothing != 'true'
        # The denylist is required wherever the secret can exist: every push, and a pull request
        # from this repository. A fork's or Dependabot's pull request has no repository secrets, so
        # there the built-in rules run alone and the merge's own push checks the denylist.
        env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
          REQUIRE: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '--require-denylist' || '' }}
        run: |
          python3 .github/release/release.py check "$RUNNER_TEMP/preview/tree" \
            --notes "$RUNNER_TEMP/preview/notes.md" $REQUIRE | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the preview (the notes, and the tree as checked)
        if: ${{ !cancelled() && steps.next.outputs.nothing != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-${{ steps.next.outputs.version }}-release-preview
          path: ${{ runner.temp }}/preview
          include-hidden-files: true
          retention-days: 14

      # From here on, only a real release. The bump goes to main first: if main moved since
      # the run started, this push fails and nothing is published; the run for that later push
      # (queued behind this one) releases both. A bump pushed with the workflow token starts no
      # new run, so a release never triggers itself.
      - name: Push the version bump to main
        if: steps.decide.outputs.publish == 'true' && steps.next.outputs.bumped == 'true'
        run: git push origin HEAD:refs/heads/main

      - name: Tag the release and publish it
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          # A run that tagged but failed to publish the Release picks up here.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            git -c "user.name=$BOT_NAME" -c "user.email=$BOT_EMAIL" \
              tag -a "$TAG" --cleanup=verbatim -F "$RUNNER_TEMP/preview/notes.md"
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" --verify-tag --latest \
              --title "Flow ${VERSION}" --notes-file "$RUNNER_TEMP/preview/notes.md"
          fi
          echo "Published ${TAG}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
